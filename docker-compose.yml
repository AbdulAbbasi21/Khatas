services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: khataz
      POSTGRES_PASSWORD: khataz_dev
      POSTGRES_DB: khataz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps data after restarts

  # optional smart search (ELASTIC_URL=http://localhost:9200 in backend/.env)
  search:
    image: elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

volumes:
  pgdata:
  esdata: